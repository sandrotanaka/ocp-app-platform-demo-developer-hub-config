# RHDH 1.10: the Lightspeed provider Secret is named lightspeed-auth-secrets and is wired to the
# lightspeed-core container through spec.application.extraEnvs.secrets in the Backstage CR.
#
# CRITICAL: LCORE only checks whether an ENABLE_* variable is DEFINED. "false" and "" both enable the
# provider. The 1.9 template shipped ENABLE_OLLAMA: "" which would turn Ollama on without a URL in 1.10,
# so only the providers actually in use are emitted here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lightspeed-auth-secrets
  namespace: rhdh
  labels:
    app.kubernetes.io/name: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: lightspeed-auth-secrets
    creationPolicy: Owner
    template:
      data:
        # --- Inference provider (any OpenAI-API-compatible endpoint: MaaS, RHOAI, vLLM) ---
        ENABLE_VLLM: "true"
        VLLM_URL: "{{ "{{ .base_url }}" }}"
        VLLM_API_KEY: "{{ "{{ .api_key }}" }}"
        # --- Query safety validation (rejects off-topic questions) ---
        ENABLE_VALIDATION: "true"
        VALIDATION_PROVIDER: "vllm"
        VALIDATION_MODEL_NAME: "qwen3-14b"
  data:
    - secretKey: base_url
      remoteRef:
        key: secrets/litellm/credentials
        property: base_url
    - secretKey: api_key
      remoteRef:
        key: secrets/litellm/credentials
        property: api_key
