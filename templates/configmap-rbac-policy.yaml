kind: ConfigMap
apiVersion: v1
metadata:
  name: rbac-policy
  namespace: rhdh
  labels:
    app.kubernetes.io/name: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  rbac-policy.csv: |
    p, role:default/location_read, catalog.entity.read, read, allow
    p, role:default/location_read, catalog.location.read, read, allow
    p, role:default/location_read_developer, catalog.entity.read, read, allow
    p, role:default/location_read_developer, catalog.location.read, read, allow
    p, role:default/platformengineer, catalog.entity.create, create, allow
    p, role:default/platformengineer, catalog.entity.refresh, update, allow
    p, role:default/platformengineer, catalog.entity.delete, delete, allow
    p, role:default/platformengineer, catalog.location.create, create, allow
    p, role:default/platformengineer, catalog.location.delete, delete, allow
    p, role:default/scaffolder_execute, scaffolder.action.execute, use, allow
    p, role:default/scaffolder_execute, scaffolder.template.parameter.read, read, allow
    p, role:default/scaffolder_execute, scaffolder.template.step.read, read, allow
    p, role:default/scaffolder_execute, scaffolder.task.create, create, allow
    p, role:default/scaffolder_execute, scaffolder.task.cancel, use, allow
    p, role:default/scaffolder_execute, scaffolder.task.read, read, allow
    p, role:default/scaffolder_execute, catalog.location.create, create, allow
    p, role:default/plugins, topology.view.read, read, allow
    p, role:default/plugins, tekton.view.read, read, allow
    p, role:default/plugins, argocd.view.read, read, allow
    p, role:default/plugins, kubernetes.proxy, use, allow
    p, role:default/plugins, kubernetes.clusters.read, read, allow
    p, role:default/plugins, kubernetes.resources.read, read, allow
    p, role:default/plugins, adoption-insights.events.read, read, allow
    p, role:default/plugins, lightspeed.chat.read, read, allow
    p, role:default/plugins, lightspeed.chat.create, create, allow
    p, role:default/plugins, lightspeed.chat.delete, delete, allow
    # Notebooks (Developer Preview): note the action is update, not read.
    p, role:default/plugins, lightspeed.notebooks.use, update, allow
    p, role:default/workflowUser, orchestrator.workflow.create-ocp-namespace-swt, read, allow
    p, role:default/workflowUser, orchestrator.workflow.use.create-ocp-namespace-swt, update, allow
    p, role:default/workflowUser, orchestrator.instanceAdminView, read, allow
    p, role:default/workflowAdmin, orchestrator.workflow, read, allow
    p, role:default/workflowAdmin, orchestrator.workflow.use, update, allow
    p, role:default/workflowAdmin, orchestrator.workflowAdminView, read, allow
    p, role:default/workflowAdmin, orchestrator.instanceAdminView, read, allow
    g, group:default/platformengineers, role:default/location_read
    g, group:default/platformengineers, role:default/platformengineer
    g, group:default/platformengineers, role:default/scaffolder_execute
    g, group:default/platformengineers, role:default/plugins
    g, group:default/developers, role:default/location_read_developer
    g, group:default/developers, role:default/developer
    g, group:default/developers, role:default/scaffolder_execute
    g, group:default/developers, role:default/plugins
    g, group:default/developers, role:default/workflowUser
    g, group:default/platformengineers, role:default/workflowAdmin
    # Plataforma de Eventos (demo): usuarios juarez e sandro enxergam apenas as entidades e templates da plataforma
    p, role:default/plataforma-eventos-leitor, catalog.entity.read, read, allow
    p, role:default/plataforma-eventos-leitor, catalog.location.read, read, allow
    p, role:default/plataforma-eventos-autoatendimento, scaffolder.action.execute, use, allow
    p, role:default/plataforma-eventos-autoatendimento, scaffolder.template.parameter.read, read, allow
    p, role:default/plataforma-eventos-autoatendimento, scaffolder.template.step.read, read, allow
    p, role:default/plataforma-eventos-autoatendimento, scaffolder.task.create, create, allow
    p, role:default/plataforma-eventos-autoatendimento, scaffolder.task.cancel, use, allow
    p, role:default/plataforma-eventos-autoatendimento, scaffolder.task.read, read, allow
    p, role:default/plataforma-eventos-assistente, lightspeed.chat.read, read, allow
    p, role:default/plataforma-eventos-assistente, lightspeed.chat.create, create, allow
    p, role:default/plataforma-eventos-assistente, lightspeed.chat.delete, delete, allow
    g, group:default/plataforma-eventos-desenvolvedores, role:default/plataforma-eventos-leitor
    g, group:default/plataforma-eventos-desenvolvedores, role:default/plataforma-eventos-autoatendimento
    g, group:default/plataforma-eventos-desenvolvedores, role:default/plataforma-eventos-assistente
    g, group:default/plataforma-eventos-engenharia, role:default/plataforma-eventos-leitor
    g, group:default/plataforma-eventos-engenharia, role:default/plataforma-eventos-autoatendimento
    g, group:default/plataforma-eventos-engenharia, role:default/plataforma-eventos-assistente
    p, role:default/plataforma-eventos-observador, kubernetes.clusters.read, read, allow
    p, role:default/plataforma-eventos-observador, kubernetes.resources.read, read, allow
    p, role:default/plataforma-eventos-observador, topology.view.read, read, allow
    p, role:default/plataforma-eventos-observador, argocd.view.read, read, allow
    g, group:default/plataforma-eventos-engenharia, role:default/plataforma-eventos-observador
  rbac-conditional-policies.yaml: |
    ---
    result: CONDITIONAL
    roleEntityRef: 'role:default/location_read_developer'
    resourceType: catalog-entity
    pluginId: catalog
    permissionMapping:
      - read
    conditions:
      not:
        rule: HAS_ANNOTATION
        resourceType: catalog-entity
        params:
          annotation: backstage.io/managed-by
          value: orchestrator
    ---
    conditions:
      params:
        claims:
          - $ownerRefs
        resourceType: catalog-entity
        rule: IS_ENTITY_OWNER
    permissionMapping:
      - delete
      - update
    pluginId: catalog
    resourceType: catalog-entity
    result: CONDITIONAL
    roleEntityRef: role:default/developer
    ---
    # Plataforma de Eventos (demo): leitura do catalogo restrita as entidades com o label "plataforma"
    # (sistema, recursos, componentes e templates da plataforma) e aos usuarios/grupos da demo
    result: CONDITIONAL
    roleEntityRef: 'role:default/plataforma-eventos-leitor'
    resourceType: catalog-entity
    pluginId: catalog
    permissionMapping:
      - read
    conditions:
      anyOf:
        - rule: HAS_LABEL
          resourceType: catalog-entity
          params:
            label: plataforma
        - allOf:
            - rule: IS_ENTITY_KIND
              resourceType: catalog-entity
              params:
                kinds:
                  - User
                  - Group
            - anyOf:
                - rule: HAS_METADATA
                  resourceType: catalog-entity
                  params: {key: name, value: plataforma-eventos-desenvolvedores}
                - rule: HAS_METADATA
                  resourceType: catalog-entity
                  params: {key: name, value: plataforma-eventos-engenharia}
                - rule: HAS_METADATA
                  resourceType: catalog-entity
                  params: {key: name, value: juarez}
                - rule: HAS_METADATA
                  resourceType: catalog-entity
                  params: {key: name, value: sandro}
    ---
    # Plataforma de Eventos (demo): execucao restrita as acoes usadas pelos templates da plataforma
    result: CONDITIONAL
    roleEntityRef: 'role:default/plataforma-eventos-autoatendimento'
    resourceType: scaffolder-action
    pluginId: scaffolder
    permissionMapping:
      - use
    conditions:
      anyOf:
        - rule: HAS_ACTION_ID
          resourceType: scaffolder-action
          params: {actionId: catalog:fetch}
        - rule: HAS_ACTION_ID
          resourceType: scaffolder-action
          params: {actionId: fetch:template}
        - rule: HAS_ACTION_ID
          resourceType: scaffolder-action
          params: {actionId: publish:gitlab:merge-request}
