apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: developer-hub
  namespace: rhdh
  labels:
    app.kubernetes.io/name: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # RHDH 1.10: Developer Lightspeed is a default-enabled Operator "flavour". The Operator injects the
  # lightspeed-core sidecar (Llama Stack as a library client), the RAG init container, and the default
  # llama-stack / lightspeed-stack / rhdh-profile ConfigMaps. Nothing is declared by hand any more.
  flavours:
    - name: lightspeed
      enabled: true
  application:
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: app-config-rhdh
    dynamicPluginsConfigMapName: dynamic-plugins
    extraEnvs:
      # Seems to be needed for the kubernetes api interaction
      # since RHPDS cluster is using self-signed certificates
      # for the api server
      envs:
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
      secrets:
        - name: gitlab-token
        - name: argocd-password
        - name: kubernetes-sa-token
        - name: oauth-client
        - name: backend-secret
        - name: backstage-orchestrator-token
        - name: sonarqube-secret
        # Inference provider credentials and guardrail settings for the LCORE sidecar.
        # 1.10 contract: the Secret is wired through extraEnvs, scoped to the lightspeed-core container.
        - name: lightspeed-auth-secrets
          containers:
            - lightspeed-core
    extraFiles:
      mountPath: /opt/app-root/src
      configMaps:
        # Custom LCORE configuration (mcp_servers block). Mapping it here is what protects it from being
        # overwritten by the Operator on reconcile.
        - name: lightspeed-stack
          mountPath: /app-root
          key: lightspeed-stack.yaml
          containers:
            - lightspeed-core
        # Llama Stack config with persistent Notebooks/files/metadata stores on the PVC below.
        - name: llama-stack-custom
          mountPath: /app-root
          key: config.yaml
          containers:
            - lightspeed-core
    route:
      enabled: true
  deployment:
    patch:
      spec:
        replicas: 1
        # dynamic-plugins-root is a ReadWriteOnce PVC. With RollingUpdate the old Pod keeps the volume
        # attached until the new Pod is Ready, and the new Pod can never start (Multi-Attach error).
        # Recreate terminates the old Pod first. $patch: replace drops the default rollingUpdate parameters,
        # which the API server forbids alongside type Recreate.
        strategy:
          $patch: replace
          type: Recreate
        template:
          spec:
            initContainers:
              # Prepares the Notebooks PVC (owned by root on first bind) for the non-root LCORE user.
              - name: init-notebooks-storage
                image: registry.access.redhat.com/ubi9/ubi-minimal:latest
                command:
                  - sh
                  - -c
                  - mkdir -p /var/lib/lightspeed-data/notebooks /var/lib/lightspeed-data/files /var/lib/lightspeed-data/feedback && chmod -R a+rwX /var/lib/lightspeed-data
                resources:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { cpu: 100m, memory: 64Mi }
                volumeMounts:
                  - name: lightspeed-notebooks
                    mountPath: /var/lib/lightspeed-data
            containers:
              # Merged by name into the Operator-injected LCORE sidecar.
              - name: lightspeed-core
                volumeMounts:
                  - name: lightspeed-notebooks
                    mountPath: /var/lib/lightspeed-data
            volumes:
              # Keep dynamic plugins on a PVC so the install step is not repeated on every restart.
              - $patch: replace
                name: dynamic-plugins-root
                persistentVolumeClaim:
                  claimName: dynamic-plugins-root
              - name: lightspeed-notebooks
                persistentVolumeClaim:
                  claimName: lightspeed-notebooks-pvc
  database:
    enableLocalDb: true
