# Custom LCORE (Lightspeed Core Service) configuration for RHDH 1.10.
#
# Based on the Operator's default lightspeed-stack-config for the lightspeed flavour. In 1.10 LCORE runs
# Llama Stack as a library client (config.yaml, providers, RAG vector DB and Notebooks storage are all
# managed by the Operator), so there is no llama_stack.url sidecar wiring any more.
#
# This file exists to own the mcp_servers block. It is mapped through spec.application.extraFiles in the
# Backstage CR so that an Operator reconcile does not overwrite it.
kind: ConfigMap
apiVersion: v1
metadata:
  name: lightspeed-stack
data:
  lightspeed-stack.yaml: |
    name: lightspeed-core-stack
    service:
      host: ${env.SERVICE_HOST:=127.0.0.1}
      port: 8080
      auth_enabled: false
      workers: 1
      color_log: true
      access_log: true
    llama_stack:
      use_as_library_client: true
      library_client_config_path: /app-root/config.yaml
    user_data_collection:
      feedback_enabled: true
      feedback_storage: '/var/lib/lightspeed-data/feedback'
    authentication:
      module: 'noop'
    # Chat history survives restarts on the lightspeed-notebooks PVC.
    conversation_cache:
      type: 'sqlite'
      sqlite:
        db_path: '/var/lib/lightspeed-data/cache.db'
    customization:
      profile_path: '/app-root/rhdh-profile.py'
    # The portal's own MCP server. `name` must match lightspeed.mcpServers[].name in app-config, and
    # provider_id must match the tool_runtime provider in the Operator-managed config.yaml.
    # The MCP backend runs in the same Pod, so localhost is the shortest and safest path.
    mcp_servers:
      - name: mcp::backstage
        provider_id: model-context-protocol
        url: http://localhost:7007/api/mcp-actions/v1
        authorization_headers:
          Authorization: "client"
